# What the checks read. Values tagged PROVISIONAL are conventions, not measured optima;
# the principle each one serves says how strong its evidence is.

[run]
tiers = ["program", "meaning"]   # every push; "syntax" runs weekly (see .github/workflows/checks.yml)

[scope]
exclude = ["LICENSE", "LICENSES/", "checks/out/"]

[logical_lines]
trigger = 80    # PROVISIONAL: past it, state the file's role in one sentence; not a limit
ceiling = 500   # PROVISIONAL: physical lines; past it, a review, never an automatic split
exempt_from_trigger = ["evidence/bibliography.md"]   # a data table, one row per work
exempt_from_ceiling = ["evidence/bibliography.md"]   # data tables are exempt; append-only logs are not
ignore_line_prefixes = []                            # footer lines a site adds to every page

[links]
wikilinks = "resolve"   # resolve | ignore (for note collections whose links may point at notes not yet written)

[outline_depth]
max_level = 3      # PROVISIONAL: the levels effect favours few levels; three is a convention
exempt = []

[provisional_tags]
max_age_days = 90  # PROVISIONAL: how long a guess may stand before it is measured or kept knowingly
files = ["*.toml", "*.py", "*.yml", "*.yaml", "*.json", "*.cfg", "*.ini"]
exempt = []

[co_change]
max_files = 20     # PROVISIONAL: a commit touching more is a rename or a format pass
min_together = 3   # PROVISIONAL
min_share = 0.75   # PROVISIONAL: of the commits of the rarer file
exempt = ["standard.md", "llms.txt", "evidence/bibliography.md"]   # built from, or shared by, many files

[type_buckets]
names = ["docs", "doc", "assets", "misc", "utils", "util", "stuff", "other", "files", "helpers"]

[overview_first]
min_statements = 20   # PROVISIONAL

[name_matches_title]
exempt = ["evidence/bibliography.md", "*index.qmd", "reader-styles/template.md"]   # stubs include their README; a template's title is the copy's

[cross_file_terms]
min_length = 6
max_files = 5   # PROVISIONAL: past it, a term is shared vocabulary
ignore_terms = ["materials", "upper bound", "lower bound"]   # bold list labels, not defined terms
exempt = ["evidence/bibliography.md", "standard.md", "llms.txt"]   # titles, and copies built from the principles

[standard_card]
facets = ["collection", "document", "sentence", "page"]   # the principle groups, in the order the card shows them

[shape_conformance]
shapes = []   # e.g. { name = "note", files = ["notes/*.md"], required = ["In three points", "Check yourself"] }

[long_sentences]
max_words = 35   # PROVISIONAL
exempt = ["evidence/bibliography.md"]

[paragraph_length]
max_sentences = 4          # PROVISIONAL
max_without_heading = 25   # PROVISIONAL
exempt = ["evidence/bibliography.md"]

[figures_present]
min_statements = 40   # PROVISIONAL
exempt = ["evidence/bibliography.md"]

[figure_captions]
exempt = []

[readable_measure]
stylesheets = ["site.css"]
measure_ch = [45, 75]
min_font_px = 16
min_line_height = 1.5

[sufficient_contrast]
stylesheets = ["site.css"]
min_ratio = 4.5
surfaces = []   # selectors that paint a surface text may sit on (a slide, a card); the page is always measured

[paraphrase]
min_words = 15
threshold = 0.9    # PROVISIONAL
max_findings = 20
exempt = ["evidence/bibliography.md"]

[document_mode]
min_statements = 20
margin = 0.02      # PROVISIONAL
exempt = ["evidence/bibliography.md"]

[name_content]
threshold = 0.2    # PROVISIONAL
role_name_folders = 3
exempt = ["evidence/bibliography.md"]

[section_cohesion]
min_words = 30
threshold = 0.25   # PROVISIONAL
exempt = []

[dependency_length]
max_distance = 12  # PROVISIONAL
exempt = ["evidence/bibliography.md"]

[clause_nesting]
max_depth = 1      # the claim: one clause inside another at most; two already mislead (Gibson & Thomas 1999)
exempt = ["evidence/bibliography.md"]

[sentence_links]
max_unlinked = 0.5 # PROVISIONAL
exempt = ["evidence/bibliography.md"]

[portable_paths]
allow_symlinks = false

[tree_shape]
max_entries = 32   # PROVISIONAL: the fastest measured layout had 32 on one level (Larson 1998)
min_entries = 3    # PROVISIONAL
max_depth = 4      # PROVISIONAL
exempt = ["LICENSES/"]

[duplication]
words = 20         # PROVISIONAL: the length of a copied run that counts as one fact held twice
exempt = []

[citations]
bibliography = "evidence/bibliography.md"
files = ["evidence/", "principles/", "reader-styles/", "shapes/", "decisions/"]
not_surnames = ["WCAG", "Colon", "Classification", "Prolegomena", "Python", "Since", "In", "From", "Until", "By", "After", "Before", "Around",
                "CONSORT", "PRISMA", "Lancet", "NEJM", "BMJ", "JAMA", "On"]   # guideline and journal names before a year

[references]
files = ["evidence/bibliography.md"]   # where references live; empty means every markdown file
cache_days = 30

[judgment]
backend = "flag"   # none | flag | local | api
answers = "checks/judgments.toml"   # answers kept with the repository; an edit to a file reopens its questions
timeout_seconds = 120

[judgment.api]
enabled = false    # PROVISIONAL: paid; stays off until the maintainer turns it on
